<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CareerTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { background: #f8fafc; }
        .card { border-radius: 18px; }
        .table { background: white; }
        .btn { border-radius: 12px; }
    </style>
</head>

<body class="bg-light">

    <div class="container mt-5 mb-5">

        <h1 class="text-primary mb-4">CareerTrack</h1>

        <nav class="mb-4">
            <a class="btn btn-outline-primary me-2" href="{{ url_for('dashboard') }}">Dashboard</a>
            <a class="btn btn-outline-success me-2" href="{{ url_for('applications') }}">Applications</a>
            <a class="btn btn-outline-dark me-2" href="{{ url_for('analytics_page') }}">Analytics</a>
            <a class="btn btn-primary" href="{{ url_for('add_application') }}">Add Application</a>
        </nav>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
        <div class="alert alert-{{ category }}" role="alert">{{ message }}</div>
        {% endfor %}
        {% endwith %}

        {% block content %}
        {% endblock %}

    </div>

</body>

</html>
